<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browser customer beside the incident commander</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#0b1015; font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color:#e6edf3; }
  .top { height:44px; display:flex; align-items:center; gap:14px; padding:0 14px; border-bottom:1px solid #222c36; }
  .tag { background:#7a2e00; color:#ffd9b3; font-weight:700; font-size:12px; padding:3px 9px; border-radius:4px; letter-spacing:.4px; }
  .title { font-weight:600; }
  .clock { margin-left:auto; font-variant-numeric:tabular-nums; color:#9fb0c0; }
  .grid { display:grid; grid-template-columns: 600px 1fr; height:calc(100% - 44px - 52px); }
  .pane { position:relative; border-right:1px solid #222c36; }
  .pane .name { position:absolute; top:0; left:0; right:0; height:22px; font-size:11px; color:#9fb0c0; text-transform:uppercase;
                letter-spacing:.7px; padding:4px 10px; background:#111820; }
  iframe { position:absolute; top:22px; left:0; width:100%; height:calc(100% - 22px); border:0; background:#fff; }
  #terminal { background:#0b1015; }
  .caption { height:52px; display:flex; align-items:center; padding:0 16px; border-top:1px solid #222c36; background:#111820;
             font-size:17px; font-weight:600; color:#fff; }
  .caption .step { color:#7ee2b8; margin-right:10px; }
</style>
</head>
<body>
<div class="top"><span class="tag" data-testid="label">DEMO, NOT EVIDENCE</span>
  <span class="title">A real Chromium customer on the real test bank, beside the frozen incident commander (keyless replay)</span>
  <span class="clock" id="clock">0.0 s</span></div>
<div class="grid">
  <div class="pane"><div class="name">What the customer sees · web-01 · Chromium</div><iframe id="customer" src="/"></iframe></div>
  <div class="pane"><div class="name">Incident commander · drawn live from python run.py demo</div><iframe id="incident" src="/incident"></iframe></div>
</div>
<div class="caption"><span class="step" id="step"></span><span id="caption">Starting a fresh copy of the bank…</span></div>
<script>
const t0 = Date.now();
setInterval(() => { document.getElementById("clock").textContent = ((Date.now() - t0) / 1000).toFixed(1) + " s"; }, 100);
window.setCaption = (step, text) => { document.getElementById("step").textContent = step; document.getElementById("caption").textContent = text; };
</script>
</body>
</html>
