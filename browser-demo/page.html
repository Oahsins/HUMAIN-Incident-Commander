<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Bank</title>
<style>
  :root { --ink:#14212b; --muted:#5d6b76; --line:#dde3e8; --bg:#f4f6f8; --card:#fff; --brand:#0f5c4d;
          --ok:#127a3e; --okbg:#e6f4ec; --bad:#b42318; --badbg:#fdecea; --warn:#9a5b00; --warnbg:#fff4e0; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--brand); color:#fff; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; }
  header b { font-size:18px; letter-spacing:.2px; }
  header span { opacity:.85; font-size:13px; }
  main { padding:16px; display:grid; gap:14px; max-width:560px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.6px; }
  .balance { font-size:28px; font-weight:650; font-variant-numeric:tabular-nums; margin-top:2px; }
  .row { display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
  label { display:grid; gap:4px; font-size:13px; color:var(--muted); }
  input { font:inherit; font-size:18px; padding:9px 10px; width:140px; border:1px solid var(--line); border-radius:8px; }
  button { font:inherit; font-weight:600; padding:10px 16px; border-radius:8px; border:1px solid var(--brand); cursor:pointer; }
  #pay { background:var(--brand); color:#fff; }
  #retry { background:#fff; color:var(--brand); }
  button:disabled { opacity:.45; cursor:default; }
  .result { margin-top:12px; padding:12px; border-radius:8px; background:#f1f3f5; min-height:48px; }
  .result.ok { background:var(--okbg); color:var(--ok); }
  .result.rejected { background:var(--badbg); color:var(--bad); }
  .result.failed { background:var(--warnbg); color:var(--warn); }
  .result .big { font-weight:650; font-size:17px; }
  .result .small { font-size:13px; opacity:.9; font-variant-numeric:tabular-nums; }
  table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; font-weight:600; }
  .pill.posted { background:#e8f0fe; color:#1a4fb3; } .pill.cleared { background:var(--okbg); color:var(--ok); }
  .pill.refused { background:var(--badbg); color:var(--bad); } .pill.failed { background:var(--warnbg); color:var(--warn); }
  .pill.pending { background:#eef0f2; color:var(--muted); }
  .empty { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header><b>Test Bank</b><span>Signed in as account cust-20</span></header>
<main>
  <section class="card">
    <div class="label">Available balance</div>
    <div class="balance" id="balance" data-testid="balance">…</div>
  </section>

  <section class="card">
    <div class="label">Send money to BANK-B · ben-400</div>
    <div class="row" style="margin-top:10px">
      <label>Amount (SAR)<input id="amount" data-testid="amount" type="number" min="1" step="1" value="400"></label>
      <button id="pay" data-testid="pay">Pay</button>
      <button id="retry" data-testid="retry" disabled>Retry same payment</button>
    </div>
    <div class="result" id="result" data-testid="last-result" data-n="0"><span class="empty">No payment yet.</span></div>
  </section>

  <section class="card">
    <div class="label">Your payments</div>
    <table style="margin-top:8px">
      <thead><tr><th>Reference</th><th>SAR</th><th>Tries</th><th>Status</th><th>Payment id</th></tr></thead>
      <tbody id="payments" data-testid="payments"><tr><td colspan="5" class="empty">None yet.</td></tr></tbody>
    </table>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const sar = (minor) => (minor / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const payments = new Map();   // end-to-end id -> {amount, tries, status, paymentId, replays}
let last = null;              // the last payment tried: {e2e, amount_minor}

function render() {
  const rows = [...payments.entries()].reverse().map(([e2e, p]) => {
    const pill = p.status || "pending";
    const extra = p.replays ? ` <span class="pill pending" data-testid="replayed">replayed ×${p.replays}</span>` : "";
    return `<tr data-testid="payment-row" data-e2e="${e2e}"><td>${e2e}</td><td>${sar(p.amount)}</td><td>${p.tries}</td>` +
           `<td><span class="pill ${pill}" data-testid="payment-status">${pill}</span>${extra}</td>` +
           `<td>${p.paymentId || "—"}</td></tr>`;
  });
  $("payments").innerHTML = rows.join("") || '<tr><td colspan="5" class="empty">None yet.</td></tr>';
}

function showResult(r) {
  const box = $("result");
  box.className = "result " + r.outcome;
  box.dataset.n = Number(box.dataset.n || 0) + 1;
  const a = r.answer || {};
  let head, detail;
  if (r.outcome === "ok" && a.replayed) {
    head = "Already paid: this payment went through once and was not sent again";
    detail = `payment ${a.payment_id} · status ${a.status}`;
  } else if (r.outcome === "ok") {
    head = "Payment accepted";
    detail = `payment ${a.payment_id} · status ${a.status}`;
  } else if (r.outcome === "rejected") {
    head = "Payment refused";
    detail = a.error || "the bank refused it";
  } else {
    head = "Payment did not go through, please try again";
    detail = a.error || "no answer";
  }
  box.innerHTML = `<div class="big" data-testid="result-title">${head}</div>` +
    `<div class="small" data-testid="result-detail">${detail}</div>` +
    `<div class="small">HTTP <span data-testid="result-http">${r.http}</span> · ${r.ms} ms · ref ${r.end_to_end_id}</div>`;
}

async function send(e2e) {
  const amount_minor = e2e ? last.amount_minor : Math.round(Number($("amount").value) * 100);
  if (!(amount_minor > 0)) return;
  $("pay").disabled = $("retry").disabled = true;
  try {
    const res = await fetch("/api/pay", { method: "POST", headers: { "Content-Type": "application/json" },
                                          body: JSON.stringify(e2e ? { amount_minor, end_to_end_id: e2e } : { amount_minor }) });
    const r = await res.json();
    last = { e2e: r.end_to_end_id, amount_minor };
    const p = payments.get(r.end_to_end_id) || { amount: amount_minor, tries: 0, status: null, paymentId: null, replays: 0 };
    p.tries += 1;
    if (r.outcome === "ok") {
      if (r.answer.replayed) p.replays += 1;
      p.paymentId = r.answer.payment_id;
      p.status = r.answer.status === "cleared" ? "cleared" : "posted";
    } else if (!p.paymentId) {
      p.status = r.outcome === "rejected" ? "refused" : "failed";
    }
    payments.set(r.end_to_end_id, p);
    showResult(r);
    render();
  } finally {
    $("pay").disabled = false;
    $("retry").disabled = !last;
    balance();
  }
}

async function balance() {
  try {
    const res = await fetch("/api/balance");
    const b = await res.json();
    if (res.ok) $("balance").textContent = "SAR " + sar(b.balance_minor);
  } catch (e) { /* keep the last balance shown */ }
}

async function refreshStatuses() {
  for (const [e2e, p] of payments) {
    if (!p.paymentId || p.status === "cleared") continue;
    try {
      const res = await fetch("/api/payment/" + p.paymentId);
      if (res.ok) { const info = await res.json(); if (info.status) p.status = info.status; }
    } catch (e) { /* try again next time */ }
  }
  render();
}

$("pay").addEventListener("click", () => send(null));
$("retry").addEventListener("click", () => last && send(last.e2e));
balance();
setInterval(refreshStatuses, 1500);
setInterval(balance, 4000);
</script>
</body>
</html>
